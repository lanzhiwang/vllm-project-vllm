services:
  # ============================================================================
  # 1. Prefill 节点 (负责卡 0 计算, 开放卡 0,1 权限以允许 NVLink P2P 直连)
  # ============================================================================
  vllm-prefill:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: vllm-disagg-proxy:latest
    container_name: vllm-prefill
    restart: unless-stopped
    ipc: host
    network_mode: host
    environment:
      - MODEL_NAME=${CONTAINER_MODEL_PATH}
      # 核心隔离点: 进程内逻辑独占 GPU 0
      - CUDA_VISIBLE_DEVICES=0
      - VLLM_DISABLE_REQUEST_ID_RANDOMIZATION=1
      - VLLM_LOGGING_LEVEL=INFO
      - NCCL_DEBUG=INFO
      - NCCL_DEBUG_SUBSYS=INIT,P2P,ENV
      - NCCL_IB_DISABLE=1
      - NCCL_P2P_DISABLE=0
      - NCCL_SHM_DISABLE=0
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - NCCL_NET_GDR_LEVEL=0
    volumes:
      - ${HOST_MODEL_PATH}:${CONTAINER_MODEL_PATH}:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1']
              capabilities: [gpu]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        vllm serve "$$MODEL_NAME" \
          --trust-remote-code \
          --use-tqdm-on-load \
          --host 0.0.0.0 \
          --port 8100 \
          --gpu-memory-utilization 0.88 \
          --max-model-len 2048 \
          --max-num-batched-tokens 8192 \
          --enable-log-requests \
          --kv-transfer-config '{
              "kv_connector": "P2pNcclConnector",
              "kv_role": "kv_producer",
              "kv_rank": 0,
              "kv_parallel_size": 2,
              "kv_ip": "'"${HOST_IP}"'",
              "kv_port": 14579,
              "kv_buffer_size": "2e9",
              "kv_connector_extra_config": {
                  "send_type": "PUT_ASYNC",
                  "nccl_num_channels": "8"
              }
          }'
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://127.0.0.1:8100/v1/models || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s
  # ============================================================================
  # 2. Decode 节点 (负责卡 1 计算, 开放卡 0,1 权限以允许接收 NVLink P2P 数据)
  # ============================================================================
  vllm-decode:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: vllm-disagg-proxy:latest
    container_name: vllm-decode
    restart: unless-stopped
    ipc: host
    network_mode: host
    environment:
      - MODEL_NAME=${CONTAINER_MODEL_PATH}
      # 核心隔离点: 进程内逻辑独占 GPU 1
      - CUDA_VISIBLE_DEVICES=1
      - VLLM_DISABLE_REQUEST_ID_RANDOMIZATION=1
      - VLLM_LOGGING_LEVEL=INFO
      - NCCL_DEBUG=INFO
      - NCCL_DEBUG_SUBSYS=INIT,P2P,ENV
      - NCCL_IB_DISABLE=1
      - NCCL_P2P_DISABLE=0
      - NCCL_SHM_DISABLE=0
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - NCCL_NET_GDR_LEVEL=0
    volumes:
      - ${HOST_MODEL_PATH}:${CONTAINER_MODEL_PATH}:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # 关键修复: 同时授权卡 0 和卡 1
              device_ids: ['0', '1']
              capabilities: [gpu]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        vllm serve "$$MODEL_NAME" \
          --trust-remote-code \
          --use-tqdm-on-load \
          --host 0.0.0.0 \
          --port 8200 \
          --gpu-memory-utilization 0.88 \
          --max-model-len 2048 \
          --max-num-batched-tokens 8192 \
          --enable-log-requests \
          --kv-transfer-config '{
              "kv_connector": "P2pNcclConnector",
              "kv_role": "kv_consumer",
              "kv_rank": 1,
              "kv_parallel_size": 2,
              "kv_ip": "'"${HOST_IP}"'",
              "kv_port": 14580,
              "kv_buffer_size": "4e9",
              "kv_connector_extra_config": {
                  "send_type": "PUT_ASYNC",
                  "nccl_num_channels": "8"
              }
          }'
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://127.0.0.1:8200/v1/models || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s
  # ============================================================================
  # 3. 调度代理服务 (CPU 运行, 无需 GPU 参与)
  # ============================================================================
  vllm-proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: vllm-disagg-proxy:latest
    container_name: vllm-proxy
    restart: unless-stopped
    network_mode: host
    depends_on:
      vllm-prefill:
        condition: service_healthy
      vllm-decode:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |-
        python3 /app/disagg_prefill_proxy_server.py \
          --host 0.0.0.0 \
          --port 8000 \
          --prefill-url http://127.0.0.1:8100 \
          --decode-url http://127.0.0.1:8200 \
          --kv-host "${HOST_IP}" \
          --prefill-kv-port 14579 \
          --decode-kv-port 14580
